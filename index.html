<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dragon Escrow Vault - Complete Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/web3@4.3.0/dist/web3.min.js"></script>
  <style>
    :root { --green: #00ffb3; --gold: #ffd700; --red: #ff4444; --bg: #0f172a; --blue: #1e293b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      min-height: 100vh;
      color: var(--gold);
      padding: 30px 15px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0,255,179,0.10) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255,215,0,0.08) 0%, transparent 60%);
      pointer-events: none;
      animation: shift 18s ease-in-out infinite;
    }
    @keyframes shift { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 40px #00ffb3cc; } 50% { box-shadow: 0 0 60px #00ffb3ff; } }
    
    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
    h1 { 
      color: var(--green); 
      text-align: center; 
      margin-bottom: 30px; 
      font-size: 2.5em; 
      text-shadow: 0 0 30px var(--green);
      animation: pulse 3s ease-in-out infinite;
    }
    
    /* LCD Dashboard */
    .lcd {
      background: linear-gradient(135deg, var(--bg) 60%, rgba(0,255,179,0.15) 100%);
      border: 8px solid var(--green);
      border-left: 0; border-right: 0;
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 25px;
      animation: glow 3s ease-in-out infinite;
    }
    .logo { 
      display: block; 
      margin: 0 auto 15px; 
      width: 100px; 
      height: 100px; 
      border-radius: 20px; 
      border: 3px solid var(--gold);
      animation: pulse 4s ease-in-out infinite;
    }
    .title {
      font-size: 1.8em;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 8px 0;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      border-left: 3px solid var(--green);
    }
    .label { color: #baffd9; font-weight: 700; font-size: 0.95em; }
    .value { color: var(--gold); font-weight: bold; text-shadow: 0 0 12px var(--gold); }
    .loading { animation: pulse 1.5s ease-in-out infinite; }
    .status-active { color: var(--green); font-weight: bold; animation: pulse 2s ease-in-out infinite; }
    .status-paused { color: var(--red); font-weight: bold; animation: pulse 2s ease-in-out infinite; }
    .fees { 
      color: var(--red); 
      background: var(--bg); 
      padding: 4px 12px; 
      border-radius: 6px; 
      border: 2px solid var(--red);
      animation: pulse 2.5s ease-in-out infinite;
    }
    
    /* Wallet Section */
    .wallet {
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid var(--green);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }
    .wallet-status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2em;
    }
    .indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }
    .indicator.on { background: var(--green); box-shadow: 0 0 15px var(--green); }
    .indicator.off { background: var(--red); box-shadow: 0 0 15px var(--red); }
    
    .wallet-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .wallet-btn {
      background: var(--bg);
      color: var(--gold);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 20px 15px;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .wallet-btn:hover:not(:disabled) { 
      background: var(--gold); 
      color: var(--bg); 
      transform: translateY(-3px);
    }
    .wallet-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .wallet-btn.connected {
      background: linear-gradient(135deg, var(--green), var(--gold));
      color: var(--bg);
      border-color: var(--green);
    }
    .wallet-info {
      background: rgba(30, 41, 59, 0.6);
      border: 2px solid var(--green);
      border-radius: 12px;
      padding: 15px;
      display: none;
    }
    .wallet-info.show { display: block; }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      margin: 5px 0;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 6px;
    }
    .info-label { color: #baffd9; font-weight: 600; }
    .info-value { color: var(--gold); font-weight: bold; }
    .admin-badge {
      background: linear-gradient(135deg, var(--gold), #ff6a00);
      color: var(--bg);
      padding: 8px 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
      font-weight: 900;
      animation: pulse 2s ease-in-out infinite;
    }
    
    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--green), var(--gold));
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 5px 20px var(--green); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-disconnect {
      background: var(--red);
      border: 2px solid var(--red);
    }
    .btn-disconnect:hover { background: #dc2626; }
    
    /* Stats Grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid var(--green);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      transition: all 0.3s;
    }
    .stat:hover { transform: translateY(-3px); box-shadow: 0 5px 25px rgba(0,255,179,0.4); }
    .stat-label { color: #baffd9; font-size: 0.85em; margin-bottom: 8px; }
    .stat-value { color: var(--gold); font-size: 1.6em; font-weight: bold; text-shadow: 0 0 15px var(--gold); }
    
    /* Messages */
    .msg {
      padding: 12px 20px;
      border-radius: 10px;
      margin: 15px 0;
      text-align: center;
      font-weight: bold;
      font-size: 0.95em;
    }
    .msg-success { background: linear-gradient(135deg, var(--green), var(--gold)); color: var(--bg); }
    .msg-error { background: linear-gradient(135deg, var(--red), #dc2626); color: #fff; }
    .msg-info { background: rgba(255, 215, 0, 0.2); color: var(--gold); border: 2px solid var(--gold); }
    
    @media (max-width: 768px) {
      h1 { font-size: 2em; }
      .wallet-btns { grid-template-columns: 1fr; }
      .row { flex-direction: column; gap: 5px; text-align: center; }
    }
  </style>
</head>

        <div class="stat-value" id="block">...</div>
      </div>
    </div>

    <div id="msg"></div>
  </div>

e":"uint256","name":"_escrowId","type":"uint256"}],"name":"getEscrow","outputs":[{"internalType":"address","name":"buyer","type":"address"},{"internalType":"address","name":"seller","type":"address"},{"internalType":"address","name":"arbiter","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"enum DragonEscrowVault.State","name":"state","type":"uint8"},{"internalType":"uint256","name":"createdAt","type":"uint256"},{"internalType":"string","name":"description","type":"string"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"_user","type":"address"}],"name":"getUserEscrows","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address payable","name":"_feeCollector","type":"address"},{"internalType":"uint256","name":"_feePercent","type":"uint256"}],"name":"initialize","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"pause","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"paused","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"proxiableUUID","outputs":[{"internalType":"bytes32","name":"","type":"bytes32"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"renounceOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"}],"name":"requestRefund","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"},{"internalType":"bool","name":"_releaseToBuyer","type":"bool"}],"name":"resolveDispute","outputs":[],"stateMutability":"nonpayable","type":"     let w3, c, userAddr = null;
    
    function msg(t, type = 'info') {
      const d = document.getElementById('msg');
      d.innerHTML = `<div class="msg msg-${type}">${t}</div>`;
      if (type !== 'info') setTimeout(() => d.innerHTML = '', 5000);
    }

    function fmt(a) { return a ? `${a.slice(0,6)}...${a.slice(-4)}` : ''; }
    
    function updateWalletStatus(connected, method = '') {
      const ind = document.getElementById('indicator');
      const txt = document.getElementById('statusText');
      const info = document.getElementById('walletInfo');
      
      if (connected) {
        ind.className = 'indicator on';
        txt.textContent = `Connected via ${method}`;
        txt.style.color = '#00ffb3';
        info.classList.add('show');
      } else {
        ind.className = 'indicator off';
        txt.textContent = 'Not Connected';
        txt.style.color = '#ff4444';
        info.classList.remove('show');
      }
    }

    async function switchToMonad() {
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: CONFIG.chainId }],
        });
      } catch (e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: CONFIG.chainId,
              chainName: 'Monad Mainnet',
              nativeCurrency: { name: 'Monad', symbol: 'MON', decimals: 18 },
              rpcUrls: [CONFIG.rpc],
              blockExplorerUrls: ['https://monadvision.com']
            }]
          });
        } else throw e;
      }
    }

    async function connectMetaMask() {
      try {
        if (!window.ethereum) {
          msg('❌ Please install MetaMask!', 'error');
          return;
        }

        msg('🦊 Connecting to MetaMask...', 'info');
        
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddr = accounts[0];
        
        await switchToMonad();
        
        w3 = new Web3(window.ethereum);
        c = new web3.eth.Contract(ABI, CONFIG.addr);
        
        const bal = await w3.eth.getBalance(userAddr);
        const cid = await w3.eth.getChainId();
        
        document.getElementById('userAddr').textContent = fmt(userAddr);
        document.getElementById('userNet').textContent = cid === CONFIG.chainIdDec ? '✅ Monad' : `⚠️ Chain ${cid}`;
        document.getElementById('userBal').textContent = `${parseFloat(w3.utils.fromWei(bal, 'ether')).toFixed(4)} MON`;
        
        // Check if admin
        const owner = await c.methods.owner().call();
        if (owner.toLowerCase() === userAddr.toLowerCase()) {
          document.getElementById('adminBadge').innerHTML = '<div class="admin-badge">⚡ ADMIN ACCESS ⚡</div>';
        }
        
        updateWalletStatus(true, 'MetaMask');
        document.getElementById('metamaskBtn').classList.add('connected');
        document.getElementById('metamaskBtn').innerHTML = '<span style="font-size: 2.5em;">✅</span><span>Connected</span>';
        
        msg('🎉 MetaMask connected!', 'success');
        
        window.ethereum.on('accountsChanged', (accounts) => {
          if (accounts.length === 0) disconnect();
          else location.reload();
        });
        window.ethereum.on('chainChanged', () => location.reload());
        
      } catch (e) {
        msg('❌ ' + e.message, 'error');
      }
    }

    function connectWeb3Auth() {
      msg('🔐 Web3Auth coming soon!
