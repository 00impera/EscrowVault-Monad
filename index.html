<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dragon Escrow Vault — Web3Auth + Contract Diagnostics</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
  <style>
    :root{--bg:#0a0e27;--text:#e6eef6}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace}
    .container{max-width:1100px;margin:20px auto;padding:12px}
    .notice{background:#121427;padding:12px;border-radius:10px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.04)}
    .btn{padding:8px 10px;border-radius:8px;border:0;cursor:pointer;margin-right:6px}
    pre{white-space:pre-wrap;background:#061025;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03)}
    #diag { margin-top:12px; font-size:.9rem; color:#cbd6e6 }
    .grid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dragon Escrow Vault — Diagnostics</h2>

    <div class="notice">
      This page tests Web3Auth SDK loading and queries the escrow contract via RPC. Use the buttons below.
    </div>

    <div class="grid">
      <button id="testLoad" class="btn">Test Web3Auth SDK Load</button>
      <button id="tryConnect" class="btn">Attempt Web3Auth Connect</button>
      <button id="queryRpc" class="btn">Query contract (RPC)</button>
      <button id="queryMy" class="btn">Query my escrows (wallet)</button>
      <button id="connectMM" class="btn">Connect MetaMask</button>
      <button id="downloadUmd" class="btn">Show UMD download cmd</button>
    </div>

    <div id="diag"><strong>Diagnostics output:</strong>
      <div id="diagLog"></div>
    </div>

    <pre id="consoleOut">Console output will appear here...</pre>
  </div>

  <script>
    /***** CONFIG *****/
    const CONFIG = {
      rpc: "https://rpc.monad.xyz",
      addr: "0x49d88eB97341108d9C6868d65a6512a4af3d183b",
      chainIdHex: "0x8F",
      chainIdDec: 143,
      web3auth: {
        clientId: "BNCSx81g7Ukojfyp47J0kQVSUiEuqRe_6iFBMusUyziWdbwdXDceON7f3WlwQ04h7DvvX1jAFhkocwg-PZ_yWqE",
        web3AuthNetwork: "sapphire_mainnet"
      },
      explorerTxUrl: (tx) => `https://monadvision.com/tx/${tx}`
    };

    /***** ABI (corrected) *****/
    const ABI = [ /* paste the ABI JSON you provided earlier */ 
      {"inputs":[],"stateMutability":"nonpayable","type":"constructor"},

      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"escrowId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"feeAmount","type":"uint256"}],"name":"FeeCollected","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":false,"internalType":"address","name":"oldCollector","type":"address"},{"indexed":false,"internalType":"address","name":"newCollector","type":"address"}],"name":"FeeCollectorUpdated","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"oldPercent","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"newPercent","type":"uint256"}],"name":"FeePercentUpdated","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"escrowId","type":"uint256"},{"indexed":true,"internalType":"address","name":"recipient","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"FundsReleased","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint8","name":"version","type":"uint8"}],"name":"Initialized","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"previousOwner","type":"address"},{"indexed":true,"internalType":"address","name":"newOwner","type":"address"}],"name":"OwnershipTransferred","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":false,"internalType":"address","name":"account","type":"address"}],"name":"Paused","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"escrowId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"PaymentDeposited","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"escrowId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"Refunded","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":false,"internalType":"address","name":"account","type":"address"}],"name":"Unpaused","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"implementation","type":"address"}],"name":"Upgraded","type":"event"},
      {"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"}],"name":"approveRefund","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"}],"name":"calculateFee","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"}],"name":"confirmDelivery","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address payable","name":"_seller","type":"address"},{"internalType":"address","name":"_arbiter","type":"address"},{"internalType":"string","name":"_description","type":"string"}],"name":"createEscrow","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"payable","type":"function"},
      {"inputs":[],"name":"emergencyWithdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"escrowCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"escrows","outputs":[{"internalType":"address payable","name":"buyer","type":"address"},{"internalType":"address payable","name":"seller","type":"address"},{"internalType":"address","name":"arbiter","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"enum DragonEscrowVault.State","name":"state","type":"uint8"},{"internalType":"uint256","name":"createdAt","type":"uint256"},{"internalType":"string","name":"description","type":"string"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"feeCollector","outputs":[{"internalType":"address payable","name":"","type":"address"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"feePercent","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"}],"name":"getEscrow","outputs":[{"internalType":"address","name":"buyer","type":"address"},{"internalType":"address","name":"seller","type":"address"},{"internalType":"address","name":"arbiter","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"enum DragonEscrowVault.State","name":"state","type":"uint8"},{"internalType":"uint256","name":"createdAt","type":"uint256"},{"internalType":"string","name":"description","type":"string"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"_user","type":"address"}],"name":"getUserEscrows","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address payable","name":"_feeCollector","type":"address"},{"internalType":"uint256","name":"_feePercent","type":"uint256"}],"name":"initialize","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"pause","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"paused","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"proxiableUUID","outputs":[{"internalType":"bytes32","name":"","type":"bytes32"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"renounceOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"}],"name":"requestRefund","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_escrowId","type":"uint256"},{"internalType":"bool","name":"_releaseToBuyer","type":"bool"}],"name":"resolveDispute","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"totalFeesCollected","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"newOwner","type":"address"}],"name":"transferOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"unpause","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address payable","name":"_newCollector","type":"address"},{"internalType":"uint256","name":"_newFeePercent","type":"uint256"}],"name":"updateFeeCollector","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"_newFeePercent","type":"uint256"}],"name":"updateFeePercent","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"newImplementation","type":"address"}],"name":"upgradeTo","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"newImplementation","type":"address"},{"internalType":"bytes","name":"data","type":"bytes"}],"name":"upgradeToAndCall","outputs":[],"stateMutability":"payable","type":"function"},
      {"stateMutability":"payable","type":"receive"}
    ];

    /***** globals *****/
    let w3 = new Web3(CONFIG.rpc);
    let contract = new w3.eth.Contract(ABI, CONFIG.addr);
    let walletProvider = null;   // provider object when wallet connected
    let walletAddress = null;

    /***** logging helpers *****/
    const elOut = id => document.getElementById(id);
    const log = (msg) => {
      elOut('consoleOut').textContent = (new Date()).toISOString() + ' — ' + msg + '\n\n' + elOut('consoleOut').textContent;
      console.log(msg);
    };
    const diagAppend = (s) => { elOut('diagLog').innerText += s + '\n'; };

    /***** Web3Auth SDK loader (same local-first list) *****/
    const WEB3AUTH_UMD_URLS = [
      '/libs/modal.umd.min.js',
      'https://cdn.jsdelivr.net/npm/@web3auth/modal@8.0.0/dist/modal.umd.min.js',
      'https://unpkg.com/@web3auth/modal@8.0.0/dist/modal.umd.min.js'
    ];
    async function probeUrl(url, timeout = 6000) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(), timeout);
        const res = await fetch(url, { method: 'GET', mode: 'cors', signal: controller.signal, cache: 'no-store' });
        clearTimeout(timer);
        return { ok: res.ok, status: res.status, url };
      } catch (e) { return { ok: false, error: e.message || String(e), url }; }
    }
    function loadScript(url, timeout = 15000) {
      return new Promise((resolve,reject)=>{
        const s = document.createElement('script'); s.src = url; s.async = true;
        let done = false;
        const timer = setTimeout(()=>{ if(done) return; done = true; s.onerror = s.onload = null; reject(new Error('timeout loading ' + url)); }, timeout);
        s.onload = () => { if(done) return; done = true; clearTimeout(timer); resolve(url); };
        s.onerror = (e) => { if(done) return; done = true; clearTimeout(timer); reject(new Error('error loading ' + url + ' — ' + (e && e.message ? e.message : e))); };
        document.head.appendChild(s);
      });
    }
    async function ensureWeb3AuthLoaded() {
      if (window.Web3Auth || window.Web3auth) { log('Web3Auth global already present'); return; }
      let errors = [];
      for (const url of WEB3AUTH_UMD_URLS) {
        diagAppend('Probing ' + url);
        const r = await probeUrl(url, 6000);
        diagAppend('probe: ' + JSON.stringify(r));
        if (!r.ok) { errors.push({url, reason: r.error || r.status}); continue; }
        try {
          log('loading script ' + url);
          await loadScript(url, 20000);
          await new Promise(r => setTimeout(r, 120));
          if (window.Web3Auth || window.Web3auth) { log('Loaded SDK from ' + url); return; }
          errors.push({url, reason: 'script loaded but global not found'});
        } catch (e) {
          errors.push({url, reason: e.message || String(e)});
          log('failed to load ' + url + ' — ' + (e.message || e));
        }
      }
      diagAppend('ERRORS: ' + JSON.stringify(errors, null, 2));
      throw new Error('Failed to load Web3Auth from any URL. See diag output.');
    }

    /***** Contract queries *****/
    async function queryContractViaRPC() {
      log('Querying contract via RPC: ' + CONFIG.addr);
      try {
        const [feeBp, totalFeesWei, collector, paused, owner, escrowCount, blockNumber, gasPrice] = await Promise.all([
          contract.methods.feePercent().call(),
          contract.methods.totalFeesCollected().call(),
          contract.methods.feeCollector().call(),
          contract.methods.paused().call(),
          contract.methods.owner().call(),
          contract.methods.escrowCount().call(),
          w3.eth.getBlockNumber(),
          w3.eth.getGasPrice()
        ]);
        const out = {
          feePercentBp: feeBp,
          feePercentPct: (Number(feeBp)/100).toFixed(2) + '%',
          totalFeesMON: Number(w3.utils.fromWei(totalFeesWei.toString(),'ether')).toString(),
          collector,
          paused,
          owner,
          escrowCount,
          blockNumber,
          gasPrice
        };
        log('Contract snapshot: ' + JSON.stringify(out, null, 2));
        diagAppend('Contract snapshot: ' + JSON.stringify(out, null, 2));
      } catch (e) {
        log('RPC query failed: ' + (e.message||e));
        diagAppend('RPC error: ' + (e.message||e));
      }
    }

    async function connectMetaMask() {
      if (!window.ethereum) { alert('MetaMask not installed'); return; }
      try {
        const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
        walletAddress = acc[0];
        // use injected provider for contract that uses a provider with signer for txs
        walletProvider = window.ethereum;
        // set w3 to provider temporarily for wallet reads
        w3 = new Web3(walletProvider);
        contract = new w3.eth.Contract(ABI, CONFIG.addr);
        log('MetaMask connected: ' + walletAddress);
        diagAppend('Wallet: ' + walletAddress);
      } catch (e) {
        log('MetaMask connect failed: ' + (e.message||e));
        diagAppend('MM error: ' + (e.message||e));
      }
    }

    // Query user escrows (requires wallet connected)
    async function queryMyEscrows() {
      if (!walletAddress) {
        alert('Connect MetaMask or Web3Auth first');
        return;
      }
      try {
        log('Fetching user escrows for ' + walletAddress);
        const ids = await contract.methods.getUserEscrows(walletAddress).call();
        log('Escrow IDs: ' + JSON.stringify(ids));
        if (!ids || ids.length === 0) { diagAppend('No escrows'); return; }
        for (const id of ids) {
          const e = await contract.methods.getEscrow(id).call();
          diagAppend(`ID ${id} buyer:${e.buyer} seller:${e.seller} amt:${w3.utils.fromWei(e.amount,'ether')} state:${e.state}`);
        }
      } catch (e) {
        log('Failed loading user escrows: ' + (e.message||e));
        diagAppend('User escrows error: ' + (e.message||e));
      }
    }

    /***** Web3Auth connect helper (keeps instance for wallet use) *****/
    async function connectWeb3AuthWithDiagnostics() {
      try {
        await ensureWeb3AuthLoaded();
      } catch (e) {
        log('ensureWeb3AuthLoaded failed: ' + e.message);
        alert('SDK load failed. See diag.');
        return;
      }
      const ctor = window.Web3Auth || (window.Web3auth && window.Web3auth.Web3Auth) || window.Web3auth;
      if (!ctor) { log('No Web3Auth constructor exposed'); alert('No ctor'); return; }
      try {
        const instance = new ctor({
          clientId: CONFIG.web3auth.clientId,
          web3AuthNetwork: CONFIG.web3auth.web3AuthNetwork,
          chainConfig: { chainNamespace: 'eip155', chainId: CONFIG.chainIdHex, rpcTarget: CONFIG.rpc }
        });
        if (typeof instance.initModal === 'function') {
          await instance.initModal();
        }
        // connect() will open modal, returns provider
        const provider = await instance.connect();
        if (!provider) { log('Web3Auth.connect returned no provider'); alert('No provider'); return; }
        walletProvider = provider;
        w3 = new Web3(provider);
        contract = new w3.eth.Contract(ABI, CONFIG.addr);
        const accs = await w3.eth.getAccounts();
        walletAddress = accs[0];
        log('Web3Auth connected wallet: ' + walletAddress);
        diagAppend('Web3Auth wallet: ' + walletAddress);
      } catch (err) {
        log('Web3Auth connect/init error: ' + (err && err.message ? err.message : err));
        diagAppend('Web3Auth error: ' + (err && err.message ? err.message : err));
      }
    }

    /***** bindings *****/
    document.getElementById('testLoad').onclick = async () => {
      elOut('consoleOut').textContent = '';
      elOut('diagLog').textContent = '';
      try { await ensureWeb3AuthLoaded(); alert('SDK loaded (or already present)'); } catch (e) { alert('SDK load failed — see diag'); }
    };
    document.getElementById('tryConnect').onclick = connectWeb3AuthWithDiagnostics;
    document.getElementById('queryRpc').onclick = queryContractViaRPC;
    document.getElementById('connectMM').onclick = connectMetaMask;
    document.getElementById('queryMy').onclick = queryMyEscrows;
    document.getElementById('downloadUmd').onclick = () => {
      alert('Download command (run on your server/dev machine):\nmkdir -p frontend/libs && curl -L -o frontend/libs/modal.umd.min.js https://cdn.jsdelivr.net/npm/@web3auth/modal@8.0.0/dist/modal.umd.min.js');
      console.log('curl command: mkdir -p frontend/libs && curl -L -o frontend/libs/modal.umd.min.js https://cdn.jsdelivr.net/npm/@web3auth/modal@8.0.0/dist/modal.umd.min.js');
    };

    // initial RPC snapshot automatically
    queryContractViaRPC().catch(()=>{});
  </script>
</body>
</html>
